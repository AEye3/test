name: Validate

on:
  pull_request:
  push:
    branches: ["**"]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure no merge conflict markers
        run: |
          if rg -n "<<<<<<<|=======|>>>>>>>" README.md app.js index.html style.css; then
            echo "Conflict markers found."
            exit 1
          fi

      - name: JavaScript syntax check
        run: node --check app.js
